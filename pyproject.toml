[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-ai-coach"
version = "0.1.0"
description = "Visual HUD observations streamed as JSONL"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8,<5", "mss>=9,<11", "pytesseract>=0.3.10,<0.4"]

[project.scripts]
cs2-events = "cs2_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
